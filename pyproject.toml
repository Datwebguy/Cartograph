[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartograph"
version = "0.1.0"
description = "Verified executable world models for ARC-AGI-3."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Datwebguy" }]
# The Duck harness (inference, taaf) is provided by the environment; see README "Install".
dependencies = []

[tool.setuptools.packages.find]
include = ["cartograph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
